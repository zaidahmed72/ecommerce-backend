name: E-commerce API

on:
  pull_request:
    paths:
      - 'portfolio/ecommerce-api/**'
      - '.github/workflows/ecommerce-api.yml'
  push:
    branches: [codex/resume-ecommerce-api]

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/ecommerce-api
    env:
      JWT_SECRET: github-actions-only-secret-not-for-production-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/ecommerce-api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: docker compose up -d --build
      - run: docker compose exec -T api npm run seed:demo
      - name: Wait for API
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:4000/health/live; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm run smoke
      - if: always()
        run: docker compose down -v
